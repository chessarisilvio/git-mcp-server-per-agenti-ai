[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server that provides Git operations for AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "you@example.com"}
]
keywords = ["mcp", "git", "ai", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "GitPython>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/git-mcp-server"

[project.scripts]
git-mcp-server = "git_mcp_server.main:main"

[tool.setuptools.packages.find]
where = ["."]