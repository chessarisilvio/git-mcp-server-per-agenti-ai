[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server that provides Git operations for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Silvio Chessari"}
]
keywords = ["mcp", "git", "ai", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "GitPython>=3.1.0",
    "mcp>=1.2.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/chessarisilvio/git-mcp-server-per-agenti-ai"

[project.scripts]
git-mcp-server = "git_mcp_server.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["git_mcp_server*"]